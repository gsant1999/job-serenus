<!doctype html>
<meta charset="utf-8">
<title>Bancada — aviso de memória da aba</title>
<!--
  Bancada do aviso que aparece quando a memória da aba encosta no teto.

  Regra 7 da régua de UX do JOB: nenhum commit que muda visual sai sem passar
  pela bancada. Esta página NÃO copia o HTML do aviso — ela recorta a função
  _cxMostrarAviso do content.js de verdade e roda. Se o código mudar e a bancada
  não for atualizada, é o código real que aparece aqui, não uma versão paralela
  que envelhece em silêncio.

  Servir da raiz do repositório:  python3 -m http.server 8899
  e abrir /testes/bancada-aviso-memoria.html
-->
<style>
  body { margin: 0; font: 14px -apple-system, sans-serif; }
  .cena { position: relative; height: 300px; overflow: hidden; border-bottom: 1px solid #888; }
  .cena > .rotulo { position: absolute; bottom: 10px; left: 14px; font-size: 12px; opacity: .75; z-index: 1; }
  /* Fundo imitando o WhatsApp Web, só para julgar contraste sobre o real. */
  .escuro { background: #0b141a; color: #e9edef; }
  .claro  { background: #f0f2f5; color: #111b21; }
  .conversa { padding: 60px 20px 0; }
  .bolha { max-width: 320px; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; }
  .escuro .bolha { background: #202c33; }
  .claro  .bolha { background: #fff; }
  #erro { padding: 20px; background: #7f1d1d; color: #fff; font-family: monospace; white-space: pre-wrap; }
</style>

<div class="cena escuro" id="cena-escuro">
  <div class="conversa">
    <div class="bolha">Boa tarde, gostaria de saber o valor do plano</div>
    <div class="bolha">Claro! Já preparo a cotação para você.</div>
  </div>
  <div class="rotulo">tema escuro (padrão do WhatsApp)</div>
</div>

<div class="cena claro" id="cena-claro">
  <div class="conversa">
    <div class="bolha">Boa tarde, gostaria de saber o valor do plano</div>
    <div class="bolha">Claro! Já preparo a cotação para você.</div>
  </div>
  <div class="rotulo">tema claro</div>
</div>

<div id="erro" hidden></div>

<script>
(async function () {
  const mostrarErro = (m) => {
    const e = document.getElementById('erro');
    e.hidden = false; e.textContent = m;
  };
  let fonte;
  try {
    const txt = await (await fetch('../extensao-whatsapp/content.js')).text();
    const i = txt.indexOf('function _cxMostrarAviso');
    const j = txt.indexOf('// Varre os retratos que ficaram para tr');
    if (i < 0 || j < 0 || j <= i) throw new Error('nao achei _cxMostrarAviso no content.js');
    fonte = txt.slice(i, j);
  } catch (e) {
    mostrarErro('Falha ao ler o content.js: ' + e.message +
                '\n\nServir da RAIZ do repositorio: python3 -m http.server 8899');
    return;
  }

  // As três dependências que a função usa. _ouvir é o helper de listener com
  // limpeza; aqui só precisa ligar. location.reload não pode rodar na bancada.
  const _ouvir = (alvo, tipo, fn, op) => alvo.addEventListener(tipo, fn, op);
  const _cxGravar = () => {};
  // `document` entra como PARÂMETRO: dentro do corpo da função ele sombreia o
  // global, então a função real desenha dentro da cena sem precisar ser editada
  // (window.document não é redefinível).
  const fabricar = new Function('_ouvir', '_cxGravar', 'document',
                                fonte + '\nreturn _cxMostrarAviso;');

  // O aviso é position:fixed. Para ver os dois temas na mesma página, cada cena
  // vira containing block (transform cria um) e recebe a sua própria cópia.
  for (const id of ['cena-escuro', 'cena-claro']) {
    const cena = document.getElementById(id);
    cena.style.transform = 'translateZ(0)';
    const doc = {
      getElementById: (x) => cena.querySelector('#' + x),
      createElement: (t) => document.createElement(t),
      body: cena,
    };
    fabricar(_ouvir, _cxGravar, doc)();
    // Abre a explicação do "i" na segunda cena, para conferir os dois estados.
    if (id === 'cena-claro') {
      const ex = cena.querySelector('#job-mem-expl');
      if (ex) ex.hidden = false;
    }
  }
})();
</script>
