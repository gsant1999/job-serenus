<!doctype html>
<!--
  BANCADA DA LISTA DE PLANOS — ferramenta de desenvolvimento, nao vai pro pacote.
  Irma da bancada-telas.html, para a tela que ela nao cobre: a arvore de
  gavetas da cotacao (MEI > coparticipacao > produto), nos dois temas.

      python3 -m http.server 8899 --directory scripts
      abrir http://localhost:8899/bancada-cotacao.html

  As funcoes aqui sao COPIA das do content.js. Mudou la, atualize aqui —
  bancada que testa codigo velho da confianca falsa, que e pior que nenhuma.
-->
<meta charset="utf-8"><title>Bancada — lista de planos</title>
<link rel="stylesheet" href="../extensao-whatsapp/content.css">
<style>html,body{margin:0;background:#0b141a;font-family:system-ui}
.par{display:flex}.lado{flex:1;padding:16px;min-height:100vh}
.escuro{background:#0b141a}.claro{background:#efeae2}
.cx{width:380px;margin:auto;border-radius:14px;overflow:hidden}
.rot{font:600 11px system-ui;text-transform:uppercase;opacity:.5;color:#fff;margin-bottom:8px}
.claro .rot{color:#111}</style>
<div class="par">
 <div class="lado escuro"><div class="rot">escuro</div><div class="cx" id="A"></div></div>

</div>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=[];
[['Bronze SP Mais',0,1,'parcial','Amil Saude - Interior I'],['Prata',0,1,'parcial','Amil Saude - Interior I'],
 ['Prata',1,1,'parcial','Amil Saude - Interior I'],['Ouro',0,1,'parcial','Amil Saude - Interior I'],
 ['Ouro',1,1,'parcial','Amil Saude - Interior I'],['Platinum R1',1,1,'parcial','Amil Saude - Interior I'],
 ['Bronze SP Mais',0,1,'total','Amil Saude - Interior I'],['Ouro',1,1,'total','Amil Saude - Interior I'],
 ['Prata',0,1,'parcial','Amil Fácil'],['Ouro',1,1,'parcial','Amil Fácil'],
 ['Bronze SP Mais',0,0,'total','Amil Fácil'],['Platinum R1',1,0,'total','Amil Fácil']]
 .forEach(([n,ac,mei,cop,prod])=>P.push({plano:{nome:n,acomodacao:!!ac},produto:{nome:prod},
   tabela:{mei:!!mei,coparticipacao:true,coparticipacaoTipo:cop,qtdVidaMin:2,qtdVidaMax:2}}));

function _texto(v){return !v?'':(typeof v==='string'?v:(v.nome||''))}
function _cotCopart(tb){if(!(tb||{}).coparticipacao)return 'Sem coparticipação';
 const t=String(tb.coparticipacaoTipo||'').toLowerCase();
 if(t.indexOf('parcial')>=0)return 'Coparticipação parcial';
 if(['total','complet','integral'].some(x=>t.indexOf(x)>=0))return 'Coparticipação completa';
 return 'Com coparticipação';}
const _COT_NIVEIS=[{chave:'mei',de:tb=>tb.mei===true?'Aceita MEI':'Não aceita MEI'},
 {chave:'copart',de:tb=>_cotCopart(tb)},{chave:'produto',de:(tb,p)=>_texto(p&&p.produto)||'Sem produto definido'}];
function _cotArvore(pls,idxs,n){if(n>=_COT_NIVEIS.length)return{folha:true,itens:idxs};
 const N=_COT_NIVEIS[n],m=new Map();
 idxs.forEach(i=>{const p=pls[i],r=N.de((p&&p.tabela)||{},p);if(!m.has(r))m.set(r,[]);m.get(r).push(i)});
 if(m.size<=1)return _cotArvore(pls,idxs,n+1);
 const f=new Map();m.forEach((s,r)=>f.set(r,_cotArvore(pls,s,n+1)));
 return{folha:false,chave:N.chave,filhos:f};}
function _cotContar(no){if(no.folha)return no.itens.length;let n=0;no.filhos.forEach(f=>n+=_cotContar(f));return n}
function _cotArvoreHTML(no,linha,prof){if(no.folha)return no.itens.map(linha).join('');let h='';
 no.filhos.forEach((f,r)=>{const c=prof===0?'job-cot-gaveta':'job-cot-subgaveta';
  h+='<details open class="'+c+' job-cot-nivel-'+esc(no.chave)+'"><summary><span class="job-cot-gaveta-n">'+esc(r)+
   '</span><span class="job-cot-gaveta-q">'+_cotContar(f)+'</span></summary>'+_cotArvoreHTML(f,linha,prof+1)+'</details>'});
 return h}
const linha=i=>'<label class="job-cot-plano"><input type="checkbox"><span><b>'+esc(P[i].plano.nome)+'</b>'+
 '<span class="job-cot-tags"><span class="job-cot-tag">'+(P[i].plano.acomodacao?'Apartamento':'Enfermaria')+'</span></span></span></label>';
const html='<div id="job-painel-doc" style="position:static"><div class="job-painel-doc-corpo">'+
 '<div class="job-sec-head job-sec-head-cot"><div class="job-cot-topo">'+
 '<button class="job-cot-seta"><span class="seta"></span>Operadoras</button>'+
 '<button class="job-cot-migalha">Campinas - SP · PME · 2 vidas</button>'+
 '<button class="job-cot-sacola">6</button></div>'+
 '<div class="job-sec-head-row"><div class="job-sec-t">Amil</div></div></div>'+
 '<div class="job-cot-wrap"><div class="job-sec-sub">Vale para todos os planos abaixo.</div>'+
 '<div class="job-cot-comp"><div class="job-cot-comp-t">Nesta cotação'+
 '<span class="job-cot-comp-c">4 de 6</span></div>'+
 '<div class="job-cot-comp-gr"><div class="job-cot-comp-opn">Plano de Saúde Vera Cruz'+
 '<span class="job-cot-comp-opq">2</span></div>'+
 '<div class="job-cot-comp-l"><span class="job-cot-comp-n">Vera Prata</span>'+
 '<span class="job-cot-comp-d">Enfermaria</span><button class="job-cot-comp-x">×</button></div>'+
 '<div class="job-cot-comp-l"><span class="job-cot-comp-n">Vera Ouro</span>'+
 '<span class="job-cot-comp-d">Apartamento</span><button class="job-cot-comp-x">×</button></div></div>'+
 '<div class="job-cot-comp-gr"><div class="job-cot-comp-opn">Amil'+
 '<span class="job-cot-comp-opq">2</span></div>'+
 '<div class="job-cot-comp-l"><span class="job-cot-comp-n">Bronze SP Mais</span>'+
 '<span class="job-cot-comp-d">Enfermaria</span><button class="job-cot-comp-x">×</button></div>'+
 '<div class="job-cot-comp-l"><span class="job-cot-comp-n">Bronze SP Mais</span>'+
 '<span class="job-cot-comp-d">Apartamento</span><button class="job-cot-comp-x">×</button></div></div>'+
 '<div class="job-cot-comp-s">Cabem mais 2. Pode somar de outras operadoras — sai tudo no mesmo comparativo.</div>'+
 '<button class="job-cot-bt-copiar forte job-cot-comp-ir">Ver preços destes 4</button></div>'+

// Segunda tela: as duas fontes de operadora lado a lado.
const op=(n,extra)=>'<button class="job-cot-op"><span class="job-cot-op-ini">'+n[0]+
 '</span><span class="job-cot-op-n">'+n+'</span>'+(extra||'')+'</button>';
const ops='<div id="job-painel-doc" style="position:static;margin-top:18px"><div class="job-painel-doc-corpo">'+
 '<div class="job-sec-head job-sec-head-cot"><div class="job-cot-topo">'+
 '<button class="job-cot-seta"><span class="seta"></span>Cotar agora</button>'+
 '<button class="job-cot-migalha">Campinas - SP · PME · 2 vidas</button></div>'+
 '<div class="job-sec-head-row"><div class="job-sec-t">Operadoras</div>'+
 '<span class="job-sec-cont">4</span></div></div>'+
 '<div class="job-cot-wrap">'+
 '<div class="job-sec-sub">Escolha uma de cada vez — cada uma que você cotar soma no mesmo comparativo.</div>'+
 '<div class="job-cot-fonte-t" style="margin-bottom:8px">Pelo Painel do Corretor</div>'+
 '<div class="job-cot-ops">'+op('Amil','<span class="job-cot-op-ok">6 planos</span>')+op('Bradesco')+
 op('Porto Seguro','<span class="job-cot-op-min">mín. 3 vidas</span>')+'</div>'+
 '<div class="job-cot-fonte"><div class="job-cot-fonte-t">Operadoras fora do Painel</div>'+
 '<div class="job-cot-fonte-s">MedSênior, Beneficência Vital, Santa Tereza e outras que o Painel '+
 'não cota. Marque planos aqui e eles entram no <b>mesmo comparativo</b> das de cima.</div>'+
 '<div class="job-cot-ops">'+op('MedSênior','<span class="job-cot-op-min">18 tabelas</span>')+

 '</div></div></div>';
// Terceira tela: Cotacoes — acao em cima, historico embaixo.
const card=(t,s)=>'<div class="job-cot-item"><div class="job-cot-item-topo">'+
 '<div class="job-cot-item-t">'+t+'</div><span class="job-cot-item-q">hoje</span></div>'+
 '<div class="job-cot-item-s">'+s+'</div><div class="job-cot-item-acoes">'+
 '<button class="job-cot-bt-copiar forte">Mandar na conversa</button>'+
 '<button class="job-cot-bt-copiar">Copiar link</button></div></div>';
const cots='<div id="job-painel-doc" style="position:static;margin-top:18px"><div class="job-painel-doc-corpo">'+
 '<div class="job-sec-head"><div class="job-sec-head-row"><div class="job-sec-t">Cotações</div>'+
 '<span class="job-sec-cont">2</span></div><div class="job-sec-sub">Lead | Milena</div></div>'+
 '<div class="job-cot-wrap">'+
 '<button class="job-cot-bt-mandar job-cot-agora">Cotar agora</button>'+
 '<div class="job-cot-agora-s">Preço buscado na hora. O comparativo sai aqui mesmo, com imagem pronta pra mandar.</div>'+
 '<div class="job-cot-hist-t">Já cotadas para Lead | Milena<span class="job-cot-hist-n">2</span></div>'+
 card('Campinas - SP · PME','4 planos · R$ 3.509,89')+card('Campinas - SP · PME','2 planos · R$ 699,38')+
 '<a class="job-cot-nova job-cot-nova-atalho">Comparar operadoras no JOB</a>'+
 '</div></div></div>';
// Quarta tela: o passo 4 com o CNPJ resolvido.
const p4='<div id="job-painel-doc" style="position:static;margin-top:18px"><div class="job-painel-doc-corpo">'+
 '<div class="job-cot-wrap">'+
 '<label class="job-cot-rot"><i>4</i> Quem vai na cotação<button class="job-i">i</button></label>'+
 '<div class="job-cot-cnpj-linha"><input class="job-cnpj-input" value="12.345.678/0001-90">'+
 '<button class="job-cnpj-btn">Buscar</button></div>'+
 '<div class="job-cot-cnpj-cartao"><div class="job-cot-cnpj-nome">MAURICIO FIOROTTO SERVICOS LTDA</div>'+
 '<div class="job-cot-tags"><span class="job-cot-tag ok">ATIVA</span>'+
 '<span class="job-cot-tag ok">MEI</span><span class="job-cot-tag">Amparo - SP</span></div>'+
 '<div class="job-cot-cnpj-cnae">Atividades de consultoria em gestão empresarial</div>'+
 '<button class="job-cot-bt-copiar" style="width:100%;margin-top:8px">Cotar para Amparo - SP</button></div>'+
 '<input class="job-cnpj-input" value="MAURICIO FIOROTTO SERVICOS LTDA">'+
 '<div class="job-cot-dica">O cliente vai ler: MAURICIO FIOROTTO SERVICOS LTDA - MEI</div>'+
 '<label class="job-cot-plano bloq" title="x"><input type="checkbox" disabled>'+
 '<span><b>Bronze SP Mais</b><span class="job-cot-tags"><span class="job-cot-tag">Apartamento</span></span>'+
 '<span class="job-cot-porque">Não aceita MEI</span></span></label>'+
 '<button class="job-cot-bt-mandar" style="width:100%;margin-top:14px">Buscar operadoras</button>'+
 '</div></div></div>';
// Quinta tela: o pe da cotacao pronta — as tres acoes da imagem e o caminho
// pro que so existe no JOB. O rotulo tem que dizer o que tem do outro lado:
// um link generico aqui ja foi clicado por engano no lugar de "Ver imagem".
const pe='<div id="job-painel-doc" style="position:static;margin-top:18px"><div class="job-painel-doc-corpo">'+
 '<div class="job-cot-wrap">'+
 '<div class="job-cot-prev-acoes">'+
 '<button class="job-cot-bt-mandar" style="flex:2">Mandar na conversa</button>'+
 '<button class="job-cot-bt-copiar" style="flex:1">Copiar</button>'+
 '<button class="job-cot-bt-copiar" style="flex:1">Baixar</button></div>'+
 '<a class="job-cot-nova">Ajustar esta cotação no JOB</a>'+
 '<div class="job-cot-prev-dica" style="margin-top:5px">Corrigir valor sem trocar o link do '+
 'cliente, destacar plano, copiar um plano só, gerar PDF. Abre numa aba do JOB — o WhatsApp '+
 'continua aqui.</div>'+
 '<a class="job-cot-nova">Nova cotação (link novo)</a>'+
 '</div></div></div>';
// Sexta tela: quatro planos com o MESMO nome. Foi o print da Hapvida: quatro
// "Smart UP", quatro precos, nada dizendo por que. So entra a etiqueta que MUDA.
const tagCmp=(t,c)=>'<span class="job-cot-tag'+(c?' '+c:'')+'">'+t+'</span>';
const linhaCmp=(n,v,difs)=>'<div class="job-cot-res"><div class="job-cot-res-n">'+n+
 (difs?'<span class="job-cot-res-dif">'+difs+'</span>':'')+'</div>'+
 '<div class="job-cot-res-v">'+v+'</div></div>';
const cmp='<div id="job-painel-doc" style="position:static;margin-top:18px"><div class="job-painel-doc-corpo">'+
 '<div class="job-sec-head"><div class="job-sec-head-row"><div class="job-sec-t">Comparativo</div>'+
 '<span class="job-sec-cont">4</span></div></div><div class="job-cot-wrap">'+
 '<div class="job-cot-gaveta aberta"><button class="job-cot-gaveta-t">'+
 '<span class="job-cot-gaveta-n">Hapvida NotreDame</span>'+
 '<span class="job-cot-gaveta-r">4 · desde R$ 247,93</span>'+
 '<span class="job-cot-gaveta-s"></span></button><div class="job-cot-gaveta-c">'+
 linhaCmp('Smart UP','R$ 247,93',tagCmp('Enfermaria')+tagCmp('Coparticipação completa','aviso'))+
 linhaCmp('Smart UP','R$ 291,68',tagCmp('Enfermaria')+tagCmp('Coparticipação parcial','aviso'))+
 linhaCmp('Smart UP','R$ 313,28',tagCmp('Apartamento')+tagCmp('Coparticipação completa','aviso'))+
 linhaCmp('Smart UP','R$ 368,57',tagCmp('Apartamento')+tagCmp('Sem coparticipação','ok'))+
 '</div></div>'+
 '<button class="job-cot-bt-mandar" style="width:100%;margin-top:12px">Salvar no JOB</button>'+
 '</div></div></div>';
// Setima tela: a extensao admitindo que quebrou, dentro da conversa.
const qb='<div id="job-painel-doc" style="position:static;margin-top:18px"><div class="job-painel-doc-corpo">'+
 '<div class="job-cot-wrap"><div class="job-barra-conv" style="position:static;display:block">'+
 '<div class="job-bc-quebra"><span class="job-bc-quebra-t">Vejo 3 documentos nesta conversa '+
 'e não consegui pôr o botão de ler em nenhum. O defeito é meu, não seu.</span>'+
 '<button class="job-bc-quebra-b">Tentar de novo</button></div>'+
 '</div></div></div></div>';
// Oitava tela: o status dentro do menu do JOB, nos dois estados.
const st=(ruim,txt)=>'<div class="job-bc-status'+(ruim?' ruim':'')+'">'+
 '<span class="job-bc-status-p"></span><span>'+txt+'</span></div>';
const sino='<div id="job-painel-doc" style="position:static;margin-top:18px">'+
 '<div class="job-painel-doc-corpo"><div class="job-cot-wrap">'+
 '<div class="job-bc-menu" style="position:static;opacity:1;transform:none">'+
 st(0,'Tudo certo por aqui')+
 '<div class="job-bc-sino">'+
 '<div class="job-bc-sino-i nova"><b>Cotação aberta pelo cliente</b>'+
 '<span>Milena abriu a cotação de Campinas</span><i>há 4 min</i></div>'+
 '<div class="job-bc-sino-i"><b>Lead novo atribuído</b>'+

 st(1,'A busca de preços está fora do ar. O Guilherme já foi avisado.')+

 '<span class="rot">Cotar pelas tabelas do JOB</span>'+

</script>
