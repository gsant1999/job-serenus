# QUATRO PERGUNTAS ANTES DE QUALQUER COISA SUBIR.
#
# Não é cobertura de teste. São as quatro verificações que teriam pego os três
# defeitos de 09/08/2026 — o dia em que o app não subia, o botão de sair virou
# página de admin e 46 funções da extensão sumiram num recorte por linha.
# Nenhum dos três foi pego por ferramenta; os três foram pegos por alguém
# olhando a tela. É isso que não escala para dez corretoras.
#
# Roda em SQLite, com JOB_DATA_DIR temporário. NENHUM segredo entra aqui: se um
# teste precisar de chave de verdade, o teste está errado.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1 · 2 · 3 — o app sobe, nenhuma rota está no lugar errado, e as rotas
      # críticas respondem o status certo com e sem credencial.
      - name: O servidor
        env:
          JOB_DATA_DIR: /tmp/ci-job
          WHATSAPP_EXT_KEY: chave-de-teste-do-ci
          SECRET_KEY: ci
        run: python scripts/ci_servidor.py

      # 4 — o pacote da extensão está completo e compila.
      - name: A extensão
        run: bash scripts/checar_extensao.sh

      - name: Arquivos declarados no manifest existem
        run: python scripts/ci_extensao_arquivos.py
