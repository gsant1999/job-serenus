<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Entrar — Proposta Saúde Beneficência</title>
<style>
  :root{ --bg:#f6f5f1; --surface:#fff; --surface-2:#efeee8; --ink:#1e2422; --ink-soft:#5b625d;
         --line:#dcdad2; --accent:#0d6b58; --accent-ink:#fff; --danger:#a3372a; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .cartao{background:var(--surface);border:1px solid var(--line);border-radius:12px;
          padding:30px 28px;width:100%;max-width:360px;
          box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px -14px rgba(0,0,0,.2);}
  h1{font-size:17px;margin:0 0 4px;letter-spacing:-.01em;}
  p.sub{margin:0 0 20px;font-size:13px;color:var(--ink-soft);}
  label{display:block;font-size:12.5px;font-weight:650;color:var(--ink-soft);margin-bottom:6px;}
  input{width:100%;font:inherit;font-size:15px;padding:10px 12px;border-radius:8px;
        border:1px solid var(--line);background:var(--surface-2);color:var(--ink);}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  button{width:100%;margin-top:14px;font:inherit;font-size:14px;font-weight:700;padding:11px;
         border:none;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer;}
  .erro{margin-top:12px;font-size:13px;color:var(--danger);font-weight:600;}
</style>
</head>
<body>
  <form class="cartao" method="post" autocomplete="off">
    <h1>Proposta Saúde Beneficência</h1>
    <p class="sub">Acesso restrito à equipe Serenus.</p>
    <label for="login">Usuário</label>
    <input type="text" id="login" name="login" autofocus required autocapitalize="none" spellcheck="false">
    <label for="senha" style="margin-top:12px;">Senha</label>
    <input type="password" id="senha" name="senha" required>
    <button type="submit">Entrar</button>
    {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
  </form>
</body>
</html>
