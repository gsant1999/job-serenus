<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    /* ── POPUP MÍNIMO ──────────────────────────────────────────────────────
       A configuração mora no painel dentro do WhatsApp, onde há largura pra
       hierarquia. Este popup tentou ser a tela inteira e ficou com meia tela
       vazia do lado — caixinha do Chrome não comporta.

       Aqui ele faz três coisas e só: diz quem está conectado, leva pro painel,
       e desliga a extensão neste computador. Nada mais precisa caber. */
    * { box-sizing: border-box; }
    body {
      width: 300px; margin: 0; padding: 16px;
      background: #14172a; color: #eaecf5;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px; line-height: 1.45;
    }
    .topo { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    /* O LOGO DE VERDADE, o mesmo do painel: os arcos girando com "JOB" no
       centro. Antes era um quadrado azul com as letras JOB dentro — um
       placeholder que eu deixei passar como se fosse a marca. */
    .marca { position: relative; width: 38px; height: 38px; flex: none; }
    .marca-arcos {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; animation: marcaGira 20s linear infinite;
    }
    .marca-txt {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700; color: #eaecf5; letter-spacing: .3px;
    }
    @keyframes marcaGira { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .marca-arcos { animation: none; } }
    .topo h1 { font-size: 14px; margin: 0; font-weight: 700; }
    .topo p { font-size: 11px; margin: 1px 0 0; color: #8b93ad; }

    .quem {
      display: flex; align-items: center; gap: 11px;
      background: #1b1f36; border: 1px solid #2a3050;
      border-radius: 12px; padding: 12px; margin-bottom: 12px;
    }
    .quem-av {
      width: 36px; height: 36px; border-radius: 11px; flex: none;
      display: flex; align-items: center; justify-content: center;
      background: rgba(33,197,143,.14); color: #21c58f;
      font-size: 14px; font-weight: 700;
    }
    .quem-n { font-size: 13.5px; font-weight: 700; }
    .quem-s { font-size: 11px; color: #8b93ad; margin-top: 1px; }
    .fora { color: #f2b53f; }

    button {
      width: 100%; border: none; border-radius: 10px; padding: 11px;
      font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: filter .12s, transform .12s;
    }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    .bt-azul { background: linear-gradient(135deg, #3b6cf6, #6d5cf0); color: #fff; }
    .bt-fraco {
      background: transparent; border: 1px solid #2a3050; color: #8b93ad;
      font-weight: 600; font-size: 12.5px; padding: 9px; margin-top: 8px;
    }

    .chave { display: flex; align-items: center; gap: 10px; cursor: pointer;
      margin-top: 14px; padding-top: 13px; border-top: 1px solid #2a3050; }
    .chave input { position: absolute; opacity: 0; width: 0; height: 0; }
    .chave-bola { width: 36px; height: 21px; border-radius: 999px; flex: none;
      background: #2a3050; position: relative; transition: background .18s; }
    .chave-bola::after { content: ''; position: absolute; top: 3px; left: 3px;
      width: 15px; height: 15px; border-radius: 50%; background: #fff;
      transition: transform .18s; }
    .chave input:checked + .chave-bola { background: #21c58f; }
    .chave input:checked + .chave-bola::after { transform: translateX(15px); }
    .chave-txt { font-size: 12.5px; font-weight: 600; }

    .nota { font-size: 11px; color: #5b6486; line-height: 1.5; margin-top: 12px; }
    #status { font-size: 11.5px; margin-top: 10px; min-height: 14px; color: #8b93ad; }
    .ok { color: #21c58f !important; } .err { color: #f2547a !important; }
  </style>
</head>
<body>

  <div class="topo">
    <span class="marca">
      <img class="marca-arcos" src="logo_arcos.png" alt="">
      <span class="marca-txt">JOB</span>
    </span>
    <div>
      <h1>JOB Serenus</h1>
      <p id="topoVersao">Extensão do WhatsApp</p>
    </div>
  </div>

  <div class="quem">
    <span class="quem-av" id="quemIni">?</span>
    <div style="flex:1 1 auto; min-width:0;">
      <div class="quem-n" id="quemNome">Não conectado</div>
      <div class="quem-s" id="quemAparelho">Entre pelo painel no WhatsApp</div>
    </div>
  </div>

  <button id="abrirPainel" class="bt-azul">Abrir configurações no WhatsApp</button>
  <button id="sair" class="bt-fraco" style="display:none;">Sair deste computador</button>

  <label class="chave">
    <input type="checkbox" id="extensaoAtiva" checked>
    <span class="chave-bola"></span>
    <span class="chave-txt">Extensão ligada aqui</span>
  </label>
  <p class="nota">Desligando, o painel some do WhatsApp Web neste computador.
    Recarregue a aba depois de mudar.</p>

  <div id="status"></div>

  <!-- Campos que a configuração antiga usava. Ficam escondidos: o popup.js
       ainda os lê pra não perder o que já estava salvo, e a tela de verdade
       agora é o painel. -->
  <div style="display:none;">
    <input id="jobUrl" type="text">
    <input id="extKey" type="password">
    <select id="usuarioId"></select>
    <div id="usuarioIdAviso"></div>
    <select id="railSide"><option value="direita"></option><option value="esquerda"></option></select>
    <select id="tema"><option value="escuro"></option><option value="claro"></option></select>
    <input id="loginEmail"><input id="loginSenha"><input id="loginApelido">
    <button id="entrar"></button><button id="salvar"></button><button id="testar"></button>
    <div id="blocoLogin"></div><div id="blocoQuem"></div>
    <details id="blocoAntigo"></details>
  </div>

  <script src="popup.js"></script>
</body>
</html>
